name: Fetch portraits
# Downloads the portraits listed in .github/avatar-urls.json ([{"id", "url"}], id = person id), turns them into
# public/avatars/<id>.webp with tools/avatars.mjs, and commits them to the branch that was pushed. It runs here
# because the editing session can't reach the image host. Review the branch, then merge it into main to publish.
on:
  push:
    branches: [avatars]
    paths: ['.github/avatar-urls.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-avatars
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: Download
        run: |
          set -euo pipefail
          mkdir -p /tmp/portraits
          jq -r '.[] | "\(.id) \(.url)"' .github/avatar-urls.json | while read -r id url; do
            [[ "$id" =~ ^[a-z0-9_]+$ ]] || { echo "Bad id: $id"; exit 1; }
            [[ "$url" =~ ^https:// ]] || { echo "Bad url for $id"; exit 1; }
            curl -fsSL --retry 3 -o "/tmp/portraits/$id.png" "$url"
            echo "$id $(stat -c %s /tmp/portraits/$id.png) bytes"
          done
      - name: Make avatars
        run: node tools/avatars.mjs /tmp/portraits
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/avatars content/employees.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Add cast portraits from avatar-urls.json"
          git push origin "HEAD:${GITHUB_REF_NAME}"
